# 展惠进销存 —— Windows 发布流水线（第三阶段）。
#
# 触发：打 v<版本> tag 并推送（例如 v0.5.3）。版本号唯一来源是 package.json；
# tag 与 package.json 版本不一致时直接失败退出（防手滑）。
# 流程：装依赖 → 版本门禁 → 构建服务端 → Playwright Chromium → 全量回归门禁
# → electron-builder 打 Windows 安装包（NSIS 单用户）并发布到该 tag 的 GitHub
# Release（含 latest.yml，供 electron-updater 检查更新）→ 静默安装冒烟 → 卸载。
# Release 标题沿用“展惠进销存 v<版本>”，与旧发行版同一条链，
# 老用户从旧安装包升级到 Electron 版时更新器能沿着同一条 Release 链找到新版。
#
# ⚠️ 本文件不要走 connector 的 snapshot-push：没有 Workflows 权限的应用走
# Contents API 写 .github/workflows/ 会被 GitHub 直接 403 拒绝（已实测），
# 且安装权限也加不上（权限由应用开发者定义）。正确路线：走 GitHub 网页上传
# （仓库 → .github/workflows → Add file → Upload files），或由有权限的成员提交。
#
# 未签名现状：安装包未签名，首次安装时 Windows SmartScreen 会弹警告，
# 用户要点“更多信息 → 仍要运行”；electron-updater 的自动更新本身不受签名影响
# （electron-builder 26.x 下 NSIS 更新不强制签名校验）。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 pnpm 10
        # 与本地锁文件同一代 pnpm（lockfileVersion 9.0，pnpm 10 的 store 格式 v10）。
        run: npm install -g pnpm@10.34.9

      - name: 安装依赖（锁定文件）
        run: pnpm install --frozen-lockfile

      - name: 版本门禁：tag 必须与 package.json 版本一致
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            Write-Error "tag $tag 与 package.json 版本 v$version 不一致：先改 package.json 再打 tag"
            exit 1
          }
          Write-Host "版本一致：$tag"

      - name: 构建服务端
        run: pnpm build

      - name: 启动服务端（回归门禁前置）
        # run-tests.cjs 只测不拉服务：它要求服务已在 127.0.0.1:7741 回答。
        # 此前流水线只构建不启动，回归门禁 1 秒即失败（v0.5.3 首发事故）。
        # 服务从仓库根目录启动，数据目录即仓库 data/，与 rebuild-clean 一致。
        shell: pwsh
        run: |
          $p = Start-Process node -ArgumentList 'dist/server/index.js' -PassThru -NoNewWindow
          $p.Id | Out-File -FilePath server.pid -Encoding ascii
          Write-Host "服务端已启动，PID $($p.Id)，等待就绪……"
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:7741/api/auth/status' -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { Write-Error '服务端 90 秒内未就绪'; exit 1 }
          Write-Host '服务端已就绪'

      - name: 安装 Playwright Chromium（UI 回归用）
        run: npx playwright install chromium

      - name: 全量回归门禁（不过不发版）
        run: node tools/run-tests.cjs --with-rounds

      - name: 停止回归用服务端
        # 必须停掉：后面的安装冒烟要测刚装好的程序（同样起在 7741），
        # 留着 CI 服务会占端口、甚至让冒烟测到错的服务。
        if: always()
        shell: pwsh
        run: |
          if (Test-Path server.pid) {
            $pid = Get-Content server.pid -Raw
            Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue
            Remove-Item server.pid -ErrorAction SilentlyContinue
            Write-Host "已停止服务端 PID $pid"
          }

      - name: 构建 Windows 安装包并发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: 安装冒烟：静默安装刚打出来的安装包
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-electron\展惠进销存-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { Write-Error '未找到安装包'; exit 1 }
          Write-Host "静默安装 $($setup.FullName)"
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA '展惠进销存\展惠进销存.exe'
          if (-not (Test-Path $exe)) { Write-Error "安装后未找到 $exe"; exit 1 }
          Start-Process $exe
          # 服务起在 127.0.0.1:7741：轮询状态接口，最多等 90 秒。
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:7741/api/auth/status' -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { Write-Error '安装后应用服务 90 秒内未就绪'; exit 1 }
          $win = Get-Process '展惠进销存' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle } | Select-Object -First 1
          if (-not $win) { Write-Error '安装后应用窗口未出现'; exit 1 }
          Write-Host "冒烟通过：窗口标题 $($win.MainWindowTitle)，服务已就绪"

      - name: 卸载冒烟产物
        shell: pwsh
        run: |
          Get-Process '展惠进销存' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $un = Join-Path $env:LOCALAPPDATA '展惠进销存\Uninstall 展惠进销存.exe'
          if (Test-Path $un) {
            Start-Process $un -ArgumentList '/S' -Wait
          } else {
            Write-Warning "未找到卸载程序 $un（安装可能失败过，见上一步）"
          }
          $dir = Join-Path $env:LOCALAPPDATA '展惠进销存'
          if (Test-Path $dir) { Write-Error "卸载后安装目录仍在：$dir"; exit 1 }
          Write-Host '卸载完成，安装目录已清理'
