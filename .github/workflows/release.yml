# 展惠进销存 —— Windows 发布流水线（第三阶段）。
#
# 触发：打 v<版本> tag 并推送（例如 v0.6.0）。版本号唯一来源是 package.json；
# tag 与 package.json 版本不一致时直接失败退出（防手滑）。
# 流程：装依赖 → 版本门禁 → 构建服务端 → Playwright Chromium → 全量回归门禁
# → electron-builder 打 Windows 安装包（NSIS 单用户）并发布到该 tag 的 GitHub
# Release（含 latest.yml，供 electron-updater 检查更新）→ 静默安装冒烟 → 卸载。
# Release 标题沿用“展惠进销存 v<版本>”，与旧发行版同一条链，
# 老用户从旧安装包升级到 Electron 版时更新器能沿着同一条 Release 链找到新版。
#
# ⚠️ 两次事故教训：
# ① 首发：只构建不启动服务，回归门禁 1 秒失败。
# ② 第二次（Release #2）：启动放在单独步骤，Windows 流水线在步骤结束时杀掉
#    该步骤拉起的后台进程，服务活不过步骤边界——启动 6 秒通过、回归 0 秒即
#    失败；另 $pid 是 PowerShell 保留变量，停服务那步也因此报错。
#    所以启动、回归、停止必须在同一个步骤里（try/finally 保证停掉），
#    且绝不能用 $pid 存进程号。
#
# ⚠️ 本文件不要走 connector 的 snapshot-push：没有 Workflows 权限的应用走
# Contents API 写 .github/workflows/ 会被 GitHub 直接 403 拒绝（已实测），
# 且安装权限也加不上（权限由应用开发者定义）。正确路线：走 GitHub 网页上传
# （仓库 → .github/workflows → Add file → Upload files），或由有权限的成员提交。
#
# 未签名现状：安装包未签名，首次安装时 Windows SmartScreen 会弹警告，
# 用户要点“更多信息 → 仍要运行”；electron-updater 的自动更新本身不受签名影响
# （electron-builder 26.x 下 NSIS 更新不强制签名校验）。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 pnpm 12
        # 与 ci.yml / Dockerfile / 本地环境同一代 pnpm（allowBuilds 已允许 electron 执行安装脚本）。
        run: npm install -g pnpm@12.23.0

      - name: 安装依赖（锁定文件）
        run: pnpm install --frozen-lockfile

      - name: 版本门禁：tag 必须与 package.json 版本一致
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            Write-Error "tag $tag 与 package.json 版本 v$version 不一致：先改 package.json 再打 tag"
            exit 1
          }
          Write-Host "版本一致：$tag"

      - name: 构建服务端
        run: pnpm build

      - name: 代码与测试门禁（Lint / Typecheck / Format / 单元与集成测试）
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run format:check
          pnpm run test:unit
          pnpm run test:integration

      - name: 安装 Playwright Chromium（UI 回归用）
        run: npx playwright install chromium

      - name: 全量回归门禁（不过不发版）
        # 启动、回归、停止必须在同一个步骤里：Windows 流水线在步骤结束时
        # 杀掉该步骤拉起的后台进程，上一版把启动放单独步骤，服务活不过
        # 步骤边界（Release #2：启动 6 秒通过、回归 0 秒即失败）。
        # run-tests.cjs 只测不拉服务：它要求服务已在 127.0.0.1:7741 回答。
        # 服务从仓库根目录启动，数据目录即仓库 data/，与 rebuild-clean 一致。
        # 停止放在 finally 里：回归无论过不过都要停掉服务，否则后面的安装
        # 冒烟会占 7741 端口、甚至测到错的服务。
        shell: pwsh
        run: |
          $proc = Start-Process node -ArgumentList 'dist/server/index.js' -PassThru -NoNewWindow
          Write-Host "服务端已启动，PID $($proc.Id)，等待就绪……"
          $testExit = 1
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($proc.HasExited) { Write-Error "服务端进程已退出（PID $($proc.Id)）"; break }
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:7741/api/auth/status' -UseBasicParsing -TimeoutSec 3
                $ready = Invoke-WebRequest -Uri 'http://127.0.0.1:7741/ready' -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200 -and $ready.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
              Start-Sleep -Seconds 3
            }
            if (-not $ok) { Write-Error '服务端 90 秒内未就绪' }
            else {
              Write-Host '服务端已就绪'
              node tools/run-tests.cjs --with-rounds
              $testExit = $LASTEXITCODE
            }
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Write-Host "已停止服务端 PID $($proc.Id)"
            }
            $lockFile = Join-Path (Get-Location) 'data\server.lock'
            if (Test-Path $lockFile) {
              $lockPidText = (Get-Content $lockFile -Raw -ErrorAction SilentlyContinue).Trim()
              if ($lockPidText -match '^\d+$') {
                $lockPid = [int]$lockPidText
                if (-not $proc -or $lockPid -ne $proc.Id) {
                  Stop-Process -Id $lockPid -Force -ErrorAction SilentlyContinue
                  Write-Host "已停止重启后的服务端 PID $lockPid"
                }
              }
            }
            $listenConns = Get-NetTCPConnection -LocalPort 7741 -State Listen -ErrorAction SilentlyContinue
            foreach ($conn in $listenConns) {
              if ($conn.OwningProcess -gt 0) {
                Stop-Process -Id $conn.OwningProcess -Force -ErrorAction SilentlyContinue
                Write-Host "已清理 7741 端口残留进程 PID $($conn.OwningProcess)"
              }
            }
            Remove-Item -Path 'data', '.tools' -Recurse -Force -ErrorAction SilentlyContinue
          }
          if ($testExit -ne 0) { exit $testExit }

      - name: 构建 Windows 安装包并发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: 安装冒烟：静默安装刚打出来的安装包
        # electron-builder NSIS 单用户安装的实际落点是
        # %LOCALAPPDATA%\Programs\<包名>\（app-builder-lib 模板 multiUser.nsh
        # 的 setInstallModePerUser：$INSTDIR =
        # "$LocalAppData\Programs\${APP_FILENAME}"，APP_FILENAME 取的是
        # package.json 的 name，即 zhanhui-jxc），只有 exe 文件名是产品名
        # 展惠进销存。#7 的诊断证实：安装器退出码 0，exe 实际在
        # Programs\zhanhui-jxc\展惠进销存.exe，Programs 里只有 zhanhui-jxc。
        # 之前按 Programs\展惠进销存\ 找，轮询 90 秒也找不到。
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-electron\展惠进销存-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { Write-Error '未找到安装包'; exit 1 }
          Write-Host "静默安装 $($setup.FullName)"
          $proc = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host "安装程序退出码：$($proc.ExitCode)"
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\zhanhui-jxc\展惠进销存.exe'
          $found = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-Path $exe) { $found = $true; break }
            Start-Sleep -Seconds 3
          }
          if (-not $found) {
            Write-Host "== 诊断：$env:LOCALAPPDATA\Programs 下的内容 =="
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -ErrorAction SilentlyContinue | Select-Object Name | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host "== 诊断：全文搜索 展惠进销存.exe =="
            Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter '展惠进销存.exe' -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table -AutoSize | Out-String | Write-Host
            Write-Error "安装后未找到 $exe"
            exit 1
          }
          Start-Process $exe
          # 服务起在 127.0.0.1:7741：轮询状态接口，最多等 90 秒。
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:7741/api/auth/status' -UseBasicParsing -TimeoutSec 3
              $ready = Invoke-WebRequest -Uri 'http://127.0.0.1:7741/ready' -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200 -and $ready.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { Write-Error '安装后应用服务 90 秒内未就绪'; exit 1 }
          # 应用窗口可能比服务晚出现：#8 里服务已就绪，但窗口单次检查
          # 没等到就报错。改为轮询最多 60 秒。
          $win = $null
          for ($i = 0; $i -lt 20; $i++) {
            $win = Get-Process '展惠进销存' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle } | Select-Object -First 1
            if ($win) { break }
            Start-Sleep -Seconds 3
          }
          if (-not $win) { Write-Error '安装后应用窗口 60 秒内未出现'; exit 1 }
          Write-Host "冒烟通过：窗口标题 $($win.MainWindowTitle)，服务已就绪"

      - name: 卸载冒烟产物
        shell: pwsh
        run: |
          Get-Process '展惠进销存' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $un = Join-Path $env:LOCALAPPDATA 'Programs\zhanhui-jxc\Uninstall 展惠进销存.exe'
          if (Test-Path $un) {
            Start-Process $un -ArgumentList '/S' -Wait
          } else {
            Write-Warning "未找到卸载程序 $un（安装可能失败过，见上一步）"
          }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\zhanhui-jxc'
          if (Test-Path $dir) { Write-Error "卸载后安装目录仍在：$dir"; exit 1 }
          Write-Host '卸载完成，安装目录已清理'
